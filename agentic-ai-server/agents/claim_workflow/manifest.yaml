id: claim_workflow
name: Claim Workflow
description: >
  Workflow-oriented multi-agent system with sequential validation, parallel
  specialist review, merge, and summarization with retry on validation.

model:
  default: gemini-2.0-flash

safety:
  max_turns: 10

dependencies:
  tools:
    - claims_api
  services:
    - session

nodes:
  intake:
    role: orchestrator
    instruction: Parse the inbound claim request and extract structured fields.
    output_key: claim_id

  validate:
    role: task
    instruction: Validate required claim fields and business rules.
    output_key: valid

  clinical_reviewer:
    role: task
    instruction: Review clinical aspects of the claim.
    input_template: "Claim ID: {intake_structured}"

  billing_reviewer:
    role: task
    instruction: Review billing codes and amounts.
    input_template: "Claim ID: {intake_structured}"

  merge_results:
    role: tool_wrapper
    instruction: Merge parallel reviewer outputs into a unified decision.

  summarize:
    role: memory
    instruction: Produce a final workflow summary for the operator.

graph:
  - type: sequential
    steps:
      - intake
      - type: retry
        max_attempts: 3
        inner:
          type: node
          node: validate
      - type: parallel
        steps:
          - clinical_reviewer
          - billing_reviewer
      - merge_results
      - summarize
