document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n      <div style=\"font-size:13px;color:var(--text-2);margin-top:3px;max-width:280px;\">Their mood, engagement, and response.<\u002Fdiv>\n      <sc-if value=\"{{ engagementSet }}\">\n        <div style=\"font-size:13px;color:var(--green);font-weight:600;margin-top:14px;\">Recorded · {{ engagementName }}<\u002Fdiv>\n        <label class=\"cp-ghost\" style=\"margin-top:11px;display:inline-flex;align-items:center;gap:7px;padding:7px 15px;border-radius:999px;border:1px solid var(--border-2);background:transparent;color:var(--text-2);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;\">Re-record<input type=\"file\" accept=\"audio/*\" onchange=\"{{ onEngagement }}\" style=\"display:none;\"><\u002Flabel>\n        <div style=\"font-size:12px;color:var(--text-3);margin-top:8px;\">A new recording replaces the current one.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ engagementNotSet }}\"><div style=\"font-size:13px;color:var(--text-3);margin-top:12px;\">Tap the orb to record<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:20px;\">\n      <div style=\"font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:3px;\">Optional observations<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--text-3);margin-bottom:6px;\">Only what you switch on is sent.<\u002Fdiv>\n      <sc-for list=\"{{ obsItems }}\" as=\"o\" hint-placeholder-count=\"3\">\n        <div style=\"border-top:1px solid var(--border);padding:14px 0 4px;\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;\">\n            <div style=\"font-weight:500;font-size:15px;\">{{ o.label }}<\u002Fdiv>\n            <button onclick=\"{{ o.toggle }}\" style=\"{{ o.toggleStyle }}\">{{ o.toggleText }}<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ o.on }}\">\n            <div style=\"display:flex;align-items:center;gap:13px;margin-top:14px;\">\n              <label class=\"cp-orb {{ o.orbMod }}\" style=\"width:64px;height:64px;flex:none;\">\n                <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z\"><\u002Fpath><path d=\"M19 10v1a7 7 0 0 1-14 0v-1\"><\u002Fpath><path d=\"M12 18v4\"><\u002Fpath><\u002Fsvg>\n                <input type=\"file\" accept=\"audio/*\" onchange=\"{{ o.onFile }}\" style=\"display:none;\">\n              <\u002Flabel>\n              <div style=\"min-width:0;\">\n                <div style=\"font-size:13px;color:var(--text-2);\">{{ o.fileLabel }}<\u002Fdiv>\n                <sc-if value=\"{{ o.recorded }}\">\n                  <label class=\"cp-ghost\" style=\"margin-top:9px;display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;border:1px solid var(--border-2);background:transparent;color:var(--text-2);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;\">Re-record<input type=\"file\" accept=\"audio/*\" onchange=\"{{ o.onFile }}\" style=\"display:none;\"><\u002Flabel>\n                  <div style=\"font-size:12px;color:var(--text-3);margin-top:7px;\">A new recording replaces the current one.<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <button onclick=\"{{ process }}\" disabled=\"{{ processDisabled }}\" class=\"cp-primary\" style=\"{{ processStyle }}\">Process shift<\u002Fbutton>\n    <sc-if value=\"{{ processDisabled }}\">\n      <div style=\"text-align:center;font-size:13px;color:var(--text-3);margin-top:12px;\">Record both prompts to continue.<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isProcessing }}\">\n  <div class=\"cp-screen\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 28px;min-height:calc(100vh - 62px);\">\n    <sc-if value=\"{{ processingActive }}\">\n      <div class=\"cp-orb cp-orb-lg breathing\" style=\"cursor:default;\">\n        <svg width=\"48\" height=\"48\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z\"><\u002Fpath><path d=\"M19 10v1a7 7 0 0 1-14 0v-1\"><\u002Fpath><path d=\"M12 18v4\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <div style=\"font-family:var(--disp);font-size:21px;font-weight:600;letter-spacing:-.01em;margin-top:36px;\">{{ procMessage }}<\u002Fdiv>\n      <div style=\"color:var(--text-2);margin-top:9px;font-size:14px;max-width:280px;\">Building your note from your recordings. About ten seconds.<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ processingError }}\">\n      <div style=\"width:56px;height:56px;border-radius:50%;background:rgba(239,64,72,.12);border:1px solid var(--red);color:var(--red-text);display:flex;align-items:center;justify-content:center;font-size:26px;\">!<\u002Fdiv>\n      <div style=\"font-family:var(--disp);font-size:19px;font-weight:600;margin-top:20px;\">We couldn't read your shift<\u002Fdiv>\n      <div style=\"color:var(--text-2);font-size:14px;margin:8px 0 24px;max-width:300px;\">{{ processingError }}<\u002Fdiv>\n      <button onclick=\"{{ process }}\" class=\"cp-primary\" style=\"padding:14px 30px;border-radius:12px;border:none;background:var(--blue);color:var(--on-accent);font-size:15px;font-weight:600;cursor:pointer;\">Try again<\u002Fbutton>\n      <button onclick=\"{{ backToRecipient }}\" class=\"cp-link\" style=\"background:none;border:none;color:var(--text-2);font-size:14px;cursor:pointer;margin-top:16px;\">Back to capture<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isReview }}\">\n  <div class=\"cp-screen\" style=\"padding:20px 20px 130px;max-width:748px;width:100%;margin:0 auto;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;\">\n      <div style=\"min-width:0;\">\n        <h2 style=\"margin:0;font-size:23px;font-weight:600;font-family:var(--disp);letter-spacing:-.02em;\">{{ reviewTitle }}<\u002Fh2>\n        <p style=\"margin:5px 0 0;font-size:14px;color:var(--text-2);\">Tap any field to fix it, then sign below.<\u002Fp>\n      <\u002Fdiv>\n      <button onclick=\"{{ discard }}\" class=\"cp-link\" style=\"background:none;border:none;color:var(--text-3);font-size:13px;cursor:pointer;padding:4px;flex:none;\">Discard<\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-for list=\"{{ gaps }}\" as=\"g\" hint-placeholder-count=\"0\">\n      <div style=\"background:rgba(245,158,11,.12);border:1px solid var(--amber);color:var(--amber-text);border-radius:12px;padding:11px 13px;font-size:13px;line-height:1.5;margin-bottom:10px;\">{{ g }}<\u002Fdiv>\n    <\u002Fsc-for>\n\n    <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;\">\n      <div style=\"font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:14px;\">Service record<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:10px;\">\n        <sc-for list=\"{{ headerRows }}\" as=\"h\" hint-placeholder-count=\"8\">\n          <div style=\"display:flex;justify-content:space-between;gap:14px;font-size:14px;\">\n            <span style=\"color:var(--text-2);flex:none;\">{{ h.label }}<\u002Fspan>\n            <span style=\"{{ h.valueStyle }}\">{{ h.value }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;\">\n      <div style=\"font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:4px;\">Support plan goals<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--text-3);margin-bottom:14px;\">Resolve every goal. A not-addressed goal needs a note.<\u002Fdiv>\n      <sc-for list=\"{{ goalItems }}\" as=\"g\" hint-placeholder-count=\"3\">\n        <div style=\"border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--surface-2);\">\n          <div style=\"display:flex;gap:8px;align-items:flex-start;margin-bottom:12px;\">\n            <div style=\"flex:1;min-width:0;\">\n              <div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--blue-soft);font-weight:600;\">{{ g.category }}<\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.45;margin-top:3px;\">{{ g.description }}<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ g.aiMatched }}\">\n              <span style=\"flex:none;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--blue-soft);border:1px solid rgba(var(--accent-rgb),.4);border-radius:999px;padding:2px 8px;\">AI MATCHED<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;\">\n            <button onclick=\"{{ g.markAddr }}\" style=\"{{ g.addrStyle }}\">Addressed<\u002Fbutton>\n            <button onclick=\"{{ g.markNot }}\" style=\"{{ g.notStyle }}\">Not addressed<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ g.isNot }}\">\n            <div style=\"margin-top:12px;\">\n              <textarea value=\"{{ g.note }}\" onchange=\"{{ g.onNote }}\" placeholder=\"Why not? (required)\" style=\"width:100%;min-height:54px;padding:11px 13px;border-radius:10px;border:1px solid var(--border-2);background:var(--base);color:var(--text);font-size:14px;line-height:1.5;\"><\u002Ftextarea>\n              <button onclick=\"{{ g.onSpeak }}\" class=\"cp-link\" style=\"margin-top:9px;background:none;border:none;color:var(--blue-soft);font-size:13px;font-weight:600;cursor:pointer;padding:4px 0;display:inline-flex;align-items:center;gap:6px;\"><svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z\"><\u002Fpath><path d=\"M19 10v1a7 7 0 0 1-14 0v-1\"><\u002Fpath><path d=\"M12 18v4\"><\u002Fpath><\u002Fsvg>Speak instead<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;\">\n      <div style=\"font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:4px;\">Medication record (837P)<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--text-3);margin-bottom:14px;\">Tap each dose. You follow the plan — meds can't be added or removed.<\u002Fdiv>\n      <sc-for list=\"{{ marRows }}\" as=\"m\" hint-placeholder-count=\"2\">\n        <div style=\"border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--surface-2);\">\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;\">\n            <div style=\"min-width:0;\">\n              <div style=\"font-weight:600;font-size:15px;\">{{ m.medication_name }}<\u002Fdiv>\n              <div style=\"font-family:var(--mono);font-size:12px;color:var(--text-2);margin-top:3px;\">{{ m.detail }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:var(--mono);font-size:13px;color:var(--blue-soft);font-weight:500;white-space:nowrap;flex:none;\">{{ m.scheduled_time }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;\">\n            <button onclick=\"{{ m.markGiven }}\" style=\"{{ m.givenStyle }}\">Given<\u002Fbutton>\n            <button onclick=\"{{ m.markNot }}\" style=\"{{ m.notStyle }}\">Not given<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ m.isGiven }}\">\n            <div style=\"margin-top:12px;\">\n              <label style=\"display:block;font-size:13px;color:var(--text-2);margin-bottom:6px;\">Your initials<\u002Flabel>\n              <input value=\"{{ m.initials }}\" onchange=\"{{ m.onInitials }}\" maxlength=\"5\" placeholder=\"e.g. MR\" style=\"width:120px;padding:10px 13px;border-radius:10px;border:1px solid var(--border-2);background:var(--base);color:var(--text);font-size:14px;text-transform:uppercase;font-family:var(--mono);\">\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ m.isNotGiven }}\">\n            <div style=\"margin-top:12px;\">\n              <label style=\"display:block;font-size:13px;color:var(--text-2);margin-bottom:8px;\">Exception code<\u002Flabel>\n              <div style=\"display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px;\">\n                <sc-for list=\"{{ m.excOptions }}\" as=\"x\" hint-placeholder-count=\"4\">\n                  <button onclick=\"{{ x.onSelect }}\" style=\"{{ x.style }}\">{{ x.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <textarea value=\"{{ m.note }}\" onchange=\"{{ m.onNote }}\" placeholder=\"Reason (required)\" style=\"width:100%;min-height:54px;padding:11px 13px;border-radius:10px;border:1px solid var(--border-2);background:var(--base);color:var(--text);font-size:14px;line-height:1.5;\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"font-family:var(--mono);font-size:12px;color:var(--text-3);line-height:1.5;\">R Refused · O Omitted · H Hospitalized · SA Self-administered<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px;\">\n      <div style=\"display:flex;justi
