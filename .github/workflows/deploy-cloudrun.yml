name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
  push:
    tags:
      - "v*"

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: agentic-ai-server
  IMAGE: ${{ vars.GCP_ARTIFACT_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/agentic-ai-server/agentic-ai-server

defaults:
  run:
    working-directory: agentic-ai-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_ARTIFACT_REGISTRY_HOST || 'us-central1-docker.pkg.dev' }}

      - name: Build and push container
        run: |
          TAG="${GITHUB_SHA::7}"
          docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Deploy to Cloud Run
        run: |
          TAG="${GITHUB_SHA::7}"
          gcloud run deploy "${SERVICE_NAME}" \
            --image "${IMAGE}:${TAG}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "${{ secrets.CLOUD_RUN_SERVICE_ACCOUNT }}" \
            --set-secrets "GOOGLE_API_KEY=GOOGLE_API_KEY:latest" \
            --set-env-vars "APP_ENV=${{ github.event.inputs.environment || 'production' }}" \
            --set-env-vars "OTEL_ENABLED=true,TRACE_TO_CLOUD=true" \
            --set-env-vars "TELEMETRY_CAPTURE_MESSAGE_CONTENT=false" \
            --set-env-vars "GOOGLE_GENAI_USE_VERTEXAI=true" \
            --set-env-vars "GOOGLE_CLOUD_PROJECT=${{ secrets.GCP_PROJECT_ID }}" \
            --set-env-vars "GOOGLE_CLOUD_LOCATION=${{ env.REGION }}" \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --port 8080
