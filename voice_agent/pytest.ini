[pytest]
# Where pytest looks for tests.
testpaths = tests
# Match the default test function/file naming.
python_files = test_*.py
python_functions = test_*
# Declared markers (avoids "unknown marker" warnings).
markers =
    integration: end-to-end test that calls live Gemini + Cloud SQL (slow, uses quota)
# Quieter output: show short tracebacks, list each test.
addopts = -v --tb=short
