[project]
name = "mock-medicaid-api"
version = "1.0.0"
description = "Mock MO HealthNet authorization API for ClaimPilot AI — Pipeline B POC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.8.2",
    "uvicorn>=0.30.6",
]

[project.scripts]
mock-medicaid-api = "main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
